<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Château d'eau · Irissarry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDE8DD;
    --surface:#F7F4EC;
    --ink:#23262B;
    --muted:#7C7568;
    --water:#2C5F6F;
    --water-light:#6FA8B5;
    --alert:#A8503B;
    --border:rgba(35,38,43,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:380px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:32px 28px 28px;
    text-align:center;
  }
  .eyebrow{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink);
    margin:0;
  }
  .subtitle{
    font-size:13px;
    color:var(--muted);
    margin:4px 0 28px;
  }
  .tank-wrap{
    position:relative;
    width:120px;
    height:160px;
    margin:0 auto 20px;
  }
  .readout{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:44px;
    line-height:1;
    margin:0 0 4px;
  }
  .status{
    font-size:13px;
    font-weight:500;
    margin:0 0 22px;
  }
  .meta{
    font-size:12px;
    color:var(--muted);
    margin:0 0 18px;
  }
  .spark{
    width:100%;
    height:36px;
    margin-bottom:22px;
  }
  .actions{
    display:flex;
    gap:8px;
    justify-content:center;
  }
  button{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    padding:9px 16px;
    border-radius:10px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
  }
  button:hover{background:rgba(35,38,43,0.06);}
  button:focus-visible{outline:2px solid var(--water);outline-offset:2px;}
  .gear{width:36px;padding:0;}
  .hidden{display:none !important;}
  .field{text-align:left;margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:5px;
  }
  .field input{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
  }
  .field input:focus-visible{outline:2px solid var(--water);outline-offset:1px;}
  .save-btn{
    width:100%;
    background:var(--water);
    color:#fff;
    border:none;
    padding:11px;
    margin-top:4px;
  }
  .error{
    font-size:13px;
    color:var(--alert);
    margin:0 0 16px;
  }
  .help{
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
    margin-top:16px;
  }
  @media (prefers-reduced-motion: no-preference){
    .fill{transition:y 0.8s ease, height 0.8s ease;}
    .wave{animation:drift 3.5s linear infinite;}
  }
  @keyframes drift{
    from{transform:translateX(0);}
    to{transform:translateX(-24px);}
  }
</style>
</head>
<body>

<div class="card" id="setup">
  <p class="eyebrow">Château d'eau</p>
  <p class="subtitle">Configuration</p>
  <div class="field">
    <label for="in-channel">Numéro de channel ThingSpeak</label>
    <input type="text" id="in-channel" placeholder="ex. 2847213" inputmode="numeric">
  </div>
  <div class="field">
    <label for="in-key">Read API Key (si channel privé)</label>
    <input type="text" id="in-key" placeholder="laisser vide si channel public">
  </div>
  <button class="save-btn" id="btn-save">Afficher le niveau</button>
  <p class="help">Le channel et la clé sont enregistrés uniquement sur cet appareil. Une fois configuré, tu peux ajouter cette page à l'écran d'accueil de ton téléphone.</p>
</div>

<div class="card hidden" id="dashboard">
  <p class="eyebrow">Château d'eau</p>
  <p class="subtitle">Irissarry</p>

  <div class="tank-wrap">
    <svg viewBox="0 0 120 160" width="120" height="160">
      <defs>
        <clipPath id="tankClip">
          <rect x="14" y="10" width="92" height="130" rx="10"/>
        </clipPath>
      </defs>
      <rect x="14" y="10" width="92" height="130" rx="10" fill="#fff" stroke="var(--ink)" stroke-opacity="0.18" stroke-width="2"/>
      <g clip-path="url(#tankClip)">
        <rect id="fill" class="fill" x="14" width="92" height="0" y="140" fill="var(--water)"/>
        <path id="wave" class="wave" d="M14,0 Q 26,-4 38,0 T 62,0 T 86,0 T 110,0 T 134,0 V 20 H 14 Z" fill="var(--water-light)" opacity="0.55"/>
      </g>
      <rect x="14" y="10" width="92" height="130" rx="10" fill="none" stroke="var(--ink)" stroke-opacity="0.35" stroke-width="2"/>
      <rect x="24" y="2" width="72" height="10" rx="3" fill="var(--ink)" fill-opacity="0.55"/>
    </svg>
  </div>

  <p class="readout" id="pct">—</p>
  <p class="status" id="status">Chargement...</p>
  <p class="meta" id="meta"></p>
  <svg class="spark" id="spark" viewBox="0 0 200 36" preserveAspectRatio="none"></svg>

  <p class="error hidden" id="error"></p>

  <div class="actions">
    <button id="btn-refresh">Actualiser</button>
    <button class="gear" id="btn-settings" aria-label="Réglages">⚙</button>
  </div>
</div>

<script>
const setupEl = document.getElementById('setup');
const dashEl = document.getElementById('dashboard');
const pctEl = document.getElementById('pct');
const statusEl = document.getElementById('status');
const metaEl = document.getElementById('meta');
const errorEl = document.getElementById('error');
const fillEl = document.getElementById('fill');
const waveEl = document.getElementById('wave');
const sparkEl = document.getElementById('spark');

function getConfig(){
  const params = new URLSearchParams(window.location.search);
  const channel = params.get('channel') || localStorage.getItem('ts_channel') || '';
  const key = params.get('key') || localStorage.getItem('ts_key') || '';
  return {channel, key};
}

function saveConfig(channel, key){
  localStorage.setItem('ts_channel', channel);
  localStorage.setItem('ts_key', key);
  const url = new URL(window.location.href);
  url.searchParams.set('channel', channel);
  if (key) url.searchParams.set('key', key);
  window.history.replaceState({}, '', url);
}

function statusFor(pct){
  if (pct >= 50) return {label: 'Bon niveau', color: 'var(--water)'};
  if (pct >= 20) return {label: 'Niveau correct', color: 'var(--water)'};
  if (pct >= 10) return {label: 'Niveau bas', color: 'var(--alert)'};
  return {label: 'Niveau critique', color: 'var(--alert)'};
}

function relativeTime(date){
  const diffMs = Date.now() - date.getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return "à l'instant";
  if (mins < 60) return `il y a ${mins} min`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `il y a ${hrs} h`;
  const days = Math.round(hrs / 24);
  return `il y a ${days} j`;
}

function drawSparkline(values){
  sparkEl.innerHTML = '';
  const nums = values.filter(v => v !== null && !isNaN(v));
  if (nums.length < 2) return;
  const min = Math.min(...nums);
  const max = Math.max(...nums);
  const range = (max - min) || 1;
  const stepX = 200 / (nums.length - 1);
  const points = nums.map((v, i) => {
    const x = i * stepX;
    const y = 32 - ((v - min) / range) * 28;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const ns = 'http://www.w3.org/2000/svg';
  const line = document.createElementNS(ns, 'polyline');
  line.setAttribute('points', points);
  line.setAttribute('fill', 'none');
  line.setAttribute('stroke', 'var(--water)');
  line.setAttribute('stroke-width', '2');
  line.setAttribute('stroke-linecap', 'round');
  line.setAttribute('stroke-linejoin', 'round');
  sparkEl.appendChild(line);
}

function showError(msg){
  errorEl.textContent = msg;
  errorEl.classList.remove('hidden');
}

async function loadData(){
  const {channel, key} = getConfig();
  if (!channel){
    setupEl.classList.remove('hidden');
    dashEl.classList.add('hidden');
    return;
  }
  setupEl.classList.add('hidden');
  dashEl.classList.remove('hidden');
  errorEl.classList.add('hidden');

  const keyParam = key ? `&api_key=${encodeURIComponent(key)}` : '';
  const url = `https://api.thingspeak.com/channels/${encodeURIComponent(channel)}/feeds.json?results=60${keyParam}`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('http_' + res.status);
    const data = await res.json();
    const feeds = (data.feeds || []).filter(f => f.field1 !== null && f.field1 !== undefined && f.field1 !== '');
    if (feeds.length === 0){
      showError("Aucune donnée disponible sur ce channel. Vérifie que l'émetteur envoie bien, et que le numéro de channel est correct.");
      pctEl.textContent = '—';
      statusEl.textContent = '';
      metaEl.textContent = '';
      return;
    }

    const last = feeds[feeds.length - 1];
    const pct = Math.max(0, Math.min(100, parseFloat(last.field1)));
    const createdAt = new Date(last.created_at);

    pctEl.textContent = Math.round(pct) + ' %';
    const st = statusFor(pct);
    statusEl.textContent = st.label;
    statusEl.style.color = st.color;
    metaEl.textContent = 'Mis à jour ' + relativeTime(createdAt) + ' · ' + createdAt.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});

    fillEl.setAttribute('height', (pct / 100 * 130).toFixed(1));
    fillEl.setAttribute('y', (140 - (pct / 100 * 130)).toFixed(1));
    waveEl.setAttribute('transform', `translate(0, ${(140 - (pct / 100 * 130) - 10).toFixed(1)})`);
    fillEl.setAttribute('fill', st.color);

    drawSparkline(feeds.map(f => parseFloat(f.field1)));
  } catch (e){
    showError("Impossible de récupérer les données. Vérifie ta connexion internet, ou le numéro de channel / la clé si le channel est privé.");
  }
}

document.getElementById('btn-save').addEventListener('click', () => {
  const channel = document.getElementById('in-channel').value.trim();
  const key = document.getElementById('in-key').value.trim();
  if (!channel){
    return;
  }
  saveConfig(channel, key);
  loadData();
});

document.getElementById('btn-refresh').addEventListener('click', loadData);
document.getElementById('btn-settings').addEventListener('click', () => {
  const {channel, key} = getConfig();
  document.getElementById('in-channel').value = channel;
  document.getElementById('in-key').value = key;
  setupEl.classList.remove('hidden');
  dashEl.classList.add('hidden');
});

loadData();
setInterval(loadData, 60000);
</script>

</body>
</html>
